services:
  - type: web
    name: ai-learning-platform-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) — do NOT commit
      # real secrets to this file:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
